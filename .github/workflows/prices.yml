name: RoadChron price dataset
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 5'
permissions:
  contents: read
concurrency:
  group: roadchron-prices
  cancel-in-progress: false
jobs:
  collect:
    # Explicit maintainer opt-in after verifying upstream collection/redelivery terms.
    if: vars.ROADCHRON_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - name: Restore and build collector
        run: |
          dotnet restore tools/central-data/Collector.csproj --locked-mode
          dotnet build tools/central-data/Collector.csproj -c Release --no-restore
      - name: Test collector policy and parsing
        run: dotnet run --no-build -c Release --project tools/central-data/Collector.csproj -- selftest
      - name: Collect and sign approved sources
        env:
          ROADCHRON_VATSERVICE_APPROVED: ${{ vars.ROADCHRON_VATSERVICE_APPROVED }}
          ROADCHRON_PRICE_SIGNING_KEY: ${{ secrets.ROADCHRON_PRICE_SIGNING_KEY }}
          ROADCHRON_ROMANIA_SCHEDULED: ${{ github.event_name == 'schedule' && github.run_attempt == 1 && 'true' || 'false' }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then args+=(--force); fi
          dotnet run --no-build -c Release --project tools/central-data/Collector.csproj -- collect TelemetryHost/CentralPriceFeedConfig.json public/fuel-prices.json "${args[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish signed static dataset
        id: deployment
        uses: actions/deploy-pages@v4
